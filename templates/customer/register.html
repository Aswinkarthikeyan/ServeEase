{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ServeEase - Register</title>

    <link
        rel="stylesheet"
        href="{% static 'css/style.css' %}"
    >

</head>

<body class="auth-page">


    <nav class="nav">

        <div class="wrap navin">

            <a href="{% url 'login' %}" class="logo">
                Serve<span>Ease</span>
            </a>

            <a
                href="{% url 'login' %}"
                class="btn secondary"
            >
                Login
            </a>

        </div>

    </nav>


    <main class="auth-main">

        <div class="auth-container">

            <div class="auth-card">

                <div class="auth-header">

                    <div class="pill">
                        Create Account
                    </div>

                    <h1>
                        Join ServeEase
                    </h1>

                    <p>
                        Find trusted professionals or offer
                        your services through ServeEase.
                    </p>

                </div>


                {% if error %}

                    <div class="form-error">
                        {{ error }}
                    </div>

                {% endif %}


                <form
                    method="POST"
                    class="form"
                    id="registerForm"
                >

                    {% csrf_token %}


                    <div class="field">

                        <label for="name">
                            Full Name
                        </label>

                        <input
                            type="text"
                            name="name"
                            id="name"
                            placeholder="Enter your full name"
                            required
                        >

                    </div>


                    <div class="field">

                        <label for="mobile">
                            Mobile Number
                        </label>

                        <input
                            type="tel"
                            name="mobile"
                            id="mobile"
                            placeholder="Enter mobile number"
                            required
                        >

                    </div>


                    <div class="field">

                        <label for="accountType">
                            Account Type
                        </label>

                        <select
                            name="account_type"
                            id="accountType"
                            required
                        >

                            <option value="">
                                Select account type
                            </option>

                            <option value="Customer">
                                Customer
                            </option>

                            <option value="Professional">
                                Professional
                            </option>

                        </select>

                    </div>


                    <div
                        class="professional-fields"
                        id="professionalFields"
                    >

                        <div class="field">

                            <label for="professionalType">
                                Professional Type
                            </label>

                            <select
                                name="professional_type"
                                id="professionalType"
                            >

                                <option value="">
                                    Select profession
                                </option>

                                <option value="Carpenter">
                                    Carpenter
                                </option>

                                <option value="Electrician">
                                    Electrician
                                </option>

                                <option value="AC Technician">
                                    AC Technician
                                </option>

                                <option value="Mechanic">
                                    Mechanic
                                </option>

                                <option value="Plumber">
                                    Plumber
                                </option>

                            </select>

                        </div>


                        <div class="form-row">

                            <div class="field">

                                <label for="experience">
                                    Experience
                                </label>

                                <input
                                    type="number"
                                    name="experience"
                                    id="experience"
                                    min="0"
                                    placeholder="Years"
                                >

                            </div>


                            <div class="field">

                                <label for="hourlyCharge">
                                    Hourly Charge
                                </label>

                                <input
                                    type="number"
                                    name="hourly_charge"
                                    id="hourlyCharge"
                                    min="0"
                                    step="0.01"
                                    placeholder="₹ / hour"
                                >

                            </div>

                        </div>


                        <div class="field">

                            <label for="location">
                                Service Location
                            </label>

                            <input
                                type="text"
                                name="location"
                                id="location"
                                placeholder="Enter your service location"
                            >

                        </div>

                    </div>


                    <div class="form-row">

                        <div class="field">

                            <label for="password">
                                Password
                            </label>

                            <input
                                type="password"
                                name="password"
                                id="password"
                                placeholder="Create password"
                                required
                            >

                        </div>


                        <div class="field">

                            <label for="confirmPassword">
                                Confirm Password
                            </label>

                            <input
                                type="password"
                                name="confirm_password"
                                id="confirmPassword"
                                placeholder="Confirm password"
                                required
                            >

                        </div>

                    </div>


                    <button
                        type="submit"
                        class="btn primary full-btn"
                    >
                        Create Account
                    </button>

                </form>


                <div class="auth-footer">

                    Already have an account?

                    <a href="{% url 'login' %}">
                        Login
                    </a>

                </div>

            </div>

        </div>

    </main>


    <script
        src="{% static 'js/app.js' %}"
        defer>
    </script>

</body>

</html>
